<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b555d">
  <meta name="description" content="Faz Já. Encontra serviços perto de ti de forma simples e rápida.">
  <title>Faz Já | Encontra quem resolve</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f6f5;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111719}.loading{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:30px}.mark{width:58px;height:58px;border-radius:20px;background:#0b555d;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:950;margin:0 auto 14px}.loading strong{display:block;font-size:28px;letter-spacing:-1px}.loading span{display:block;color:#6c7779;margin-top:7px}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div><div class="mark">FJ</div><strong>Faz Já.</strong><span>A abrir a plataforma…</span></div></div>
  <script>
    (async()=>{
      try{
        const response=await fetch('../fazperto/index.html',{cache:'no-store'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        let html=await response.text();
        html=html.replace(/<head([^>]*)>/i,'<head$1><base href="../fazperto/">');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.getElementById('loading').innerHTML='<div><div class="mark">FJ</div><strong>Faz Já.</strong><span>Não foi possível abrir a plataforma. Recarrega a página.</span></div>';
      }
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075862">
  <meta name="description" content="Chama O Pro. Precisas. Encontras. Está feito.">
  <title>Chama O Pro | Precisas. Encontras. Está feito.</title>
  <style>
    :root{--petrol:#075862;--petrol2:#043f47}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,var(--petrol),var(--petrol2));color:#fff;display:grid;place-items:center;min-height:100vh;overflow:hidden}
    .loader{display:grid;place-items:center;text-align:center;padding:24px}
    .loader-logo{width:108px;height:108px;background:url('../fazja-preview/logo-mark.svg') center/contain no-repeat;filter:drop-shadow(0 0 13px rgba(255,255,255,.18));animation:logoGlow 1.15s ease-in-out infinite alternate}
    .loader.error{gap:12px}.loader.error .loader-logo{width:82px;height:82px;animation:none}.loader.error strong{font-size:18px}.loader.error span{color:#dce9e9;font-size:14px;max-width:320px;line-height:1.45}
    @keyframes logoGlow{from{opacity:.82;transform:scale(.975);filter:drop-shadow(0 0 8px rgba(255,255,255,.16))}to{opacity:1;transform:scale(1.035);filter:drop-shadow(0 0 24px rgba(255,255,255,.42))}}
    @media(prefers-reduced-motion:reduce){.loader-logo{animation:none!important;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="loader" aria-label="A abrir Chama O Pro"><div class="loader-logo" aria-hidden="true"></div></div>
  <script>
    (async function(){
      const startedAt = performance.now();
      const minimumLoadingMs = 3500;
      try {
        const versionResponse = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
        const version = await versionResponse.json();
        const build = String(version.build || '22');
        const appResponse = await fetch('../fazja-preview/index.html?build=' + encodeURIComponent(build) + '&t=' + Date.now(), { cache: 'no-store' });
        let html = await appResponse.text();
        html = html.replace('<head>', '<head><base href="../fazja-preview/">');
        html = html.replace(/styles\.css\?v=\d+/g, 'styles.css?v=' + build);
        html = html.replace(/account\.css\?v=\d+/g, 'account.css?v=' + build);
        html = html.replace(/app\.js\?v=\d+/g, 'app.js?v=' + build);
        html = html.replace(/account\.js\?v=\d+/g, 'account.js?v=' + build);
        html = html.replace('</head>', '<link rel="stylesheet" href="./community18.css?v=' + build + '"><link rel="stylesheet" href="./brand-refresh.css?v=' + build + '"><link rel="stylesheet" href="./mockup21.css?v=' + build + '"><link rel="stylesheet" href="./ux22.css?v=' + build + '"><style id="copBuild21Transition">body::before,body::after{display:none!important;content:none!important}body{animation:copPlatformReveal 1.05s cubic-bezier(.18,.72,.22,1) both!important}@keyframes copPlatformReveal{0%{opacity:0;filter:blur(1px);transform:translateY(6px)}50%{opacity:.72;filter:blur(.35px)}100%{opacity:1;filter:blur(0);transform:translateY(0)}}@media(prefers-reduced-motion:reduce){body{animation:none!important}}</style></head>');
        html = html.replace('</body>', '<script type="module" src="./js/community.js?v=' + build + '"><\/script><script type="module" src="./navigation22.js?v=' + build + '"><\/script></body>');
        const remaining = Math.max(0, minimumLoadingMs - (performance.now() - startedAt));
        if (remaining) await new Promise((resolve) => setTimeout(resolve, remaining));
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const remaining = Math.max(0, minimumLoadingMs - (performance.now() - startedAt));
        if (remaining) await new Promise((resolve) => setTimeout(resolve, remaining));
        document.body.innerHTML = '<div class="loader error"><div class="loader-logo"></div><strong>Não foi possível abrir o Chama O Pro.</strong><span>Verifica a ligação e tenta novamente.</span></div>';
      }
    })();
  </script>
</body>
</html>

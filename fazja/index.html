<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b555d">
  <meta name="description" content="Faz Já. Precisas. Encontras. Está feito.">
  <title>Faz Já | Precisas. Encontras. Está feito.</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f9f8;color:#073d44;display:grid;place-items:center;min-height:100vh}
    .loader{display:grid;gap:12px;text-align:center;padding:24px}.mark{width:52px;height:52px;margin:auto;border-radius:16px;background:#0b555d;color:#fff;display:grid;place-items:center;font-weight:900}.loader span{color:#607174;font-size:14px}
  </style>
</head>
<body>
  <div class="loader"><div class="mark">FJ</div><strong>A abrir o Faz Já…</strong><span>A carregar a versão mais recente.</span></div>
  <script>
    (async function(){
      try {
        const versionResponse = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
        const version = await versionResponse.json();
        const build = String(version.build || '9');
        const appResponse = await fetch('../fazja-preview/index.html?build=' + encodeURIComponent(build) + '&t=' + Date.now(), { cache: 'no-store' });
        let html = await appResponse.text();
        html = html.replace('<head>', '<head><base href="../fazja-preview/">');
        html = html.replace(/account\.css\?v=\d+/g, 'account.css?v=' + build);
        html = html.replace(/app\.js\?v=\d+/g, 'app.js?v=' + build);
        html = html.replace(/account\.js\?v=\d+/g, 'account.js?v=' + build);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="loader"><div class="mark">FJ</div><strong>Não foi possível abrir o Faz Já.</strong><span>Verifica a ligação e tenta novamente.</span></div>';
      }
    })();
  </script>
</body>
</html>

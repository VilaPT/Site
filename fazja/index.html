<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b555d">
  <meta name="description" content="Chama O Pro. Precisas. Encontras. Está feito.">
  <title>Chama O Pro | Precisas. Encontras. Está feito.</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#0b555d,#073d44);color:#fff;display:grid;place-items:center;min-height:100vh;overflow:hidden}
    .loader{display:grid;place-items:center;text-align:center;padding:24px}
    .brand-sequence{display:flex;align-items:baseline;justify-content:center;gap:.22em;font-size:clamp(40px,11vw,66px);line-height:1;font-weight:1000;letter-spacing:-2.8px;white-space:nowrap}
    .piece{display:inline-block;opacity:0;transform:translateY(12px) scale(.985);animation:pieceIn .56s cubic-bezier(.2,.72,.22,1) forwards}
    .piece.chama{animation-delay:.12s}.piece.o{animation-delay:.74s}.piece.pro{animation-delay:1.30s}.piece.bang{margin-left:-.12em;animation-delay:1.82s}
    .piece.bang::after{content:"";position:absolute;inset:-.2em;border-radius:50%;pointer-events:none}
    .piece.bang{position:relative;animation-name:pieceIn,bangGlow;animation-duration:.56s,1s;animation-delay:1.82s,2.18s;animation-timing-function:cubic-bezier(.2,.72,.22,1),ease-in-out;animation-fill-mode:forwards,both;animation-iteration-count:1,infinite;animation-direction:normal,alternate}
    .brand-sequence{animation:brandExit .48s ease 3.02s forwards}
    .loader.error{gap:12px}.loader.error .brand-sequence{font-size:36px;animation:none}.loader.error .piece{opacity:1;transform:none;animation:none}.loader span{color:#dce9e9;font-size:14px}
    @keyframes pieceIn{to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes bangGlow{from{text-shadow:0 0 8px rgba(255,255,255,.24),0 0 16px rgba(255,255,255,.12);transform:translateY(0) scale(1)}to{text-shadow:0 0 16px rgba(255,255,255,.82),0 0 38px rgba(255,255,255,.52),0 0 64px rgba(255,255,255,.22);transform:translateY(0) scale(1.08)}}
    @keyframes brandExit{to{opacity:0;transform:scale(.985);filter:blur(1.2px)}}
    @media(prefers-reduced-motion:reduce){.piece,.piece.bang,.brand-sequence{animation:none!important;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="loader"><div class="brand-sequence" aria-label="Chama O Pro!"><span class="piece chama">Chama</span><span class="piece o">O</span><span class="piece pro">Pro</span><span class="piece bang">!</span></div></div>
  <script>
    (async function(){
      const startedAt = performance.now();
      const minimumLoadingMs = 3500;
      try {
        const versionResponse = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
        const version = await versionResponse.json();
        const build = String(version.build || '19');
        const appResponse = await fetch('../fazja-preview/index.html?build=' + encodeURIComponent(build) + '&t=' + Date.now(), { cache: 'no-store' });
        let html = await appResponse.text();
        html = html.replace('<head>', '<head><base href="../fazja-preview/">');
        html = html.replace(/styles\.css\?v=\d+/g, 'styles.css?v=' + build);
        html = html.replace(/account\.css\?v=\d+/g, 'account.css?v=' + build);
        html = html.replace(/app\.js\?v=\d+/g, 'app.js?v=' + build);
        html = html.replace(/account\.js\?v=\d+/g, 'account.js?v=' + build);
        html = html.replace('</head>', '<link rel="stylesheet" href="./community18.css?v=' + build + '"><style id="copBuild19Transition">body::before,body::after{display:none!important;content:none!important}body{animation:copPlatformReveal 1.28s cubic-bezier(.18,.72,.22,1) both!important}@keyframes copPlatformReveal{0%{opacity:0;filter:blur(2px);transform:translateY(8px)}45%{opacity:.62;filter:blur(.7px)}100%{opacity:1;filter:blur(0);transform:translateY(0)}}@media(prefers-reduced-motion:reduce){body{animation:none!important}}</style></head>');
        html = html.replace('</body>', '<script type="module" src="./js/community.js?v=' + build + '"><\/script></body>');
        const remaining = Math.max(0, minimumLoadingMs - (performance.now() - startedAt));
        if (remaining) await new Promise((resolve) => setTimeout(resolve, remaining));
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const remaining = Math.max(0, minimumLoadingMs - (performance.now() - startedAt));
        if (remaining) await new Promise((resolve) => setTimeout(resolve, remaining));
        document.body.innerHTML = '<div class="loader error"><div class="brand-sequence"><span class="piece">Chama</span><span class="piece">O</span><span class="piece">Pro</span><span class="piece">!</span></div><strong>Não foi possível abrir o Chama O Pro.</strong><span>Verifica a ligação e tenta novamente.</span></div>';
      }
    })();
  </script>
</body>
</html>

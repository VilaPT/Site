<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chama O Pro | Diagnóstico</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f7;color:#163236}.wrap{max-width:820px;margin:0 auto;padding:28px 18px}.card{background:#fff;border:1px solid #d8e3e3;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(8,55,61,.06)}h1{margin:0 0 8px;color:#0b555d;font-size:26px}p{color:#5d7274}.group{margin-top:18px}.group:first-child{margin-top:0}.group h2{font-size:15px;margin:0 0 6px;color:#0b555d}.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid #edf2f2;font-size:14px}.ok{color:#137333;font-weight:750}.fail{color:#b3261e;font-weight:750}.pending{color:#6b7778}.summary{margin-top:18px;padding-top:14px;border-top:1px solid #dfe9e9;font-weight:800}.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}button,a{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.primary{background:#0b555d;color:#fff}.ghost{background:#e9f1f1;color:#0b555d}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Diagnóstico do Chama O Pro</h1>
    <p>Verifica os ficheiros ativos que participam no arranque da plataforma. Não altera dados, não inicia sessão e não escreve na base de dados.</p>
    <section class="card">
      <div id="checks"></div>
      <div class="summary" id="summary">A verificar…</div>
      <div class="actions"><button class="primary" id="run" type="button">Verificar novamente</button><a class="ghost" href="./">Abrir Chama O Pro</a></div>
    </section>
  </main>
  <script>
    const groups=[
      ['Núcleo',[
        ['Aplicação','../fazja-preview/index.html'],['Módulo principal','../fazja-preview/app.js'],['Área de conta','../fazja-preview/account.js'],['Configuração','../fazja-preview/js/config.js'],['Supabase','../fazja-preview/js/supabase.js'],['Autenticação','../fazja-preview/js/auth.js'],['Pesquisa','../fazja-preview/js/search.js'],['Pedidos','../fazja-preview/js/requests.js'],['Profissionais','../fazja-preview/js/professionals.js'],['Comunidade','../fazja-preview/js/community.js'],['Logótipo','../fazja-preview/logo-chama-o-pro-transparent.png'],['Service worker','./sw.js']
      ]],
      ['Módulos adicionais',[
        ['Navegação e mensagens','../fazja-preview/navigation-messages.js'],['Homepage','../fazja-preview/homepage-flow.js'],['Negócio','../fazja-preview/business37.js'],['Social','../fazja-preview/social38.js'],['Atividade profissional','../fazja-preview/professional-activity.js'],['Relatórios','../fazja-preview/reports.js'],['Administração','../fazja-preview/admin-control.js'],['Distritos do perfil','../fazja-preview/district-profile.js'],['Consola do proprietário','../fazja-preview/owner-console.js'],['Distritos da administração','../fazja-preview/owner-district-multi.js']
      ]],
      ['Estilos',[
        ['Comunidade','../fazja-preview/community18.css'],['Identidade e navegação','../fazja-preview/shell-early.css'],['Verificação','../fazja-preview/verification29.css'],['Perfil','../fazja-preview/profile30.css'],['Chat','../fazja-preview/chat31.css'],['Agenda','../fazja-preview/appointment32.css'],['Navegação final','../fazja-preview/shell-late.css'],['Mensagens diretas','../fazja-preview/directchat35.css'],['Homepage','../fazja-preview/homepage-flow.css'],['Negócio','../fazja-preview/business37.css'],['Social','../fazja-preview/social38.css'],['Atividade profissional','../fazja-preview/professional-activity.css'],['Administração','../fazja-preview/admin-control.css'],['Relatórios','../fazja-preview/reports.css'],['Consola do proprietário','../fazja-preview/owner-console.css'],['Distritos da administração','../fazja-preview/owner-district-multi.css'],['Autenticação móvel','../fazja-preview/auth-viewport.css'],['Editor profissional móvel','../fazja-preview/pro-editor-viewport.css']
      ]]
    ];
    const checks=document.getElementById('checks');
    const summary=document.getElementById('summary');

    function render(){
      checks.innerHTML=groups.map(([title,files])=>'<section class="group"><h2>'+title+'</h2>'+files.map(([name])=>'<div class="row"><span>'+name+'</span><span class="pending">A verificar…</span></div>').join('')+'</section>').join('');
    }

    async function run(){
      render();summary.textContent='A verificar…';
      const rows=[...checks.querySelectorAll('.row')];
      const files=groups.flatMap(([,items])=>items);
      let passed=0;
      await Promise.all(files.map(async([,url],index)=>{
        const state=rows[index].lastElementChild;
        try{
          const response=await fetch(url+(url.includes('?')?'&':'?')+'health='+Date.now(),{cache:'no-store'});
          if(!response.ok)throw new Error(String(response.status));
          const bytes=(await response.arrayBuffer()).byteLength;
          if(bytes<16)throw new Error('ficheiro vazio');
          state.textContent='OK';state.className='ok';passed+=1;
        }catch(error){
          state.textContent='Falhou';state.className='fail';
        }
      }));
      summary.textContent=passed===files.length?'Tudo operacional: '+passed+'/'+files.length+' ficheiros OK.':passed+'/'+files.length+' verificações passaram. Revê os itens assinalados a vermelho.';
    }

    document.getElementById('run').addEventListener('click',run);
    run();
  </script>
</body>
</html>

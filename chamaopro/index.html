<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b555d">
  <meta name="description" content="Chama O Pro. Precisas. Encontras. Está feito.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Chama O Pro | Precisas. Encontras. Está feito.</title>
  <link rel="preload" href="../fazja-preview/logo-chama-o-pro-transparent.png" as="image" type="image/png">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#0b555d,#073d44);color:#fff;min-height:100svh;overflow:hidden}.loader{position:fixed;inset:0;display:grid;place-items:center;padding:24px}.loader-stack{display:grid;place-items:center;text-align:center;gap:12px}.loader-logo{display:block;width:clamp(175px,48vw,245px);height:auto;opacity:0;transform:scale(.92);animation:logoIn .45s ease forwards,logoGlow .75s ease-in-out .45s infinite alternate}.loader.error .loader-logo{opacity:1;transform:none;animation:none;width:150px}.loader span{color:#dce9e9;font-size:14px;max-width:320px}.retry{border:1px solid rgba(255,255,255,.35);background:#fff;color:#073d44;border-radius:14px;padding:11px 18px;font:inherit;font-weight:750;cursor:pointer}@keyframes logoIn{to{opacity:1;transform:scale(1)}}@keyframes logoGlow{from{filter:drop-shadow(0 10px 20px rgba(0,0,0,.22)) drop-shadow(0 0 8px rgba(74,232,225,.18))}to{filter:drop-shadow(0 15px 28px rgba(0,0,0,.28)) drop-shadow(0 0 26px rgba(74,232,225,.68))}}@media(prefers-reduced-motion:reduce){.loader-logo{animation:none;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="loader" id="openingLoader" aria-label="A abrir o Chama O Pro"><div class="loader-stack"><img class="loader-logo" src="../fazja-preview/logo-chama-o-pro-transparent.png" alt="Símbolo do Chama O Pro" fetchpriority="high"></div></div>
  <script>
    (async function(){
      const startedAt=performance.now();
      const minimumLoadingMs=650;
      const appEntry='../fazja-preview/index.html';
      const styles=[
        'community18.css','shell-early.css','verification29.css','profile30.css','chat31.css','appointment32.css','shell-late.css','directchat35.css','homepage-flow.css','business37.css','social38.css','professional-activity.css','admin-control.css','reports.css','owner-console.css','owner-district-multi.css','auth-viewport.css','pro-editor-viewport.css'
      ];
      const scripts=[
        'js/community.js','enhancements26.js','navigation25.js','homepage-flow.js','business37.js','social38.js','professional-activity.js','reports.js','admin-control.js','district-profile.js','owner-console.js','owner-district-multi.js'
      ];
      const unique=(items)=>[...new Set(items)];

      async function fetchApp(url,attempts=2){
        let lastError=null;
        for(let attempt=1;attempt<=attempts;attempt+=1){
          const controller=new AbortController();
          const timeout=setTimeout(()=>controller.abort(),10000);
          try{
            const response=await fetch(url,{cache:'no-store',signal:controller.signal});
            if(!response.ok)throw new Error('Resposta '+response.status);
            const text=await response.text();
            if(!/<head(?:\s[^>]*)?>/i.test(text)||!/<\/head>/i.test(text)||!/<\/body>/i.test(text))throw new Error('Documento da aplicação incompleto');
            return text;
          }catch(error){
            lastError=error;
            if(attempt<attempts)await new Promise(resolve=>setTimeout(resolve,250));
          }finally{
            clearTimeout(timeout);
          }
        }
        throw lastError||new Error('Falha ao carregar a aplicação');
      }

      try{
        const fresh=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
        let html=await fetchApp(appEntry+'?fresh='+encodeURIComponent(fresh));
        html=html.replace(/<head([^>]*)>/i,'<head$1><base href="../fazja-preview/">');
        html=html.replace(/\?v=\d+/g,'?fresh='+fresh);

        const handoffStyle='<style id="copBootStyle">body::before,body::after{display:none!important;content:none!important}.top,main,.footer{animation:none!important}#copBootHandoff{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:linear-gradient(145deg,#0b555d,#073d44);opacity:1;transition:opacity .18s ease}#copBootHandoff.cop-boot-out{opacity:0;pointer-events:none}#copBootHandoff img{display:block;width:clamp(175px,48vw,245px);height:auto;filter:drop-shadow(0 15px 28px rgba(0,0,0,.28)) drop-shadow(0 0 22px rgba(74,232,225,.5))}@media(prefers-reduced-motion:reduce){#copBootHandoff{transition:none}}</style>';
        const styleTags=unique(styles).map(src=>'<link rel="stylesheet" href="./'+src+'?fresh='+fresh+'">').join('');
        html=html.replace(/<\/head>/i,handoffStyle+styleTags+'</head>');

        const handoff='<div id="copBootHandoff" aria-label="A abrir o Chama O Pro"><img src="./logo-chama-o-pro-transparent.png" alt="Símbolo do Chama O Pro"></div>';
        html=html.replace(/<body([^>]*)>/i,'<body$1>'+handoff);

        const scriptTags=unique(scripts).map(src=>'<scr'+'ipt type="module" src="./'+src+'?fresh='+fresh+'"></scr'+'ipt>').join('');
        const handoffScript='<scr'+'ipt>(function(){var removed=false;function finish(){if(removed)return;removed=true;var el=document.getElementById("copBootHandoff");if(!el)return;el.classList.add("cop-boot-out");setTimeout(function(){el.remove();var css=document.getElementById("copBootStyle");if(css)css.remove();},220)}window.addEventListener("load",function(){requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(finish,80)})})},{once:true});setTimeout(finish,12000)})();</scr'+'ipt>';
        html=html.replace(/<\/body>/i,scriptTags+handoffScript+'</body>');

        const remaining=Math.max(0,minimumLoadingMs-(performance.now()-startedAt));
        if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));
        document.open();document.write(html);document.close();
      }catch(error){
        console.error('[Chama O Pro] bootstrap error',error);
        document.body.innerHTML='<div class="loader error"><div class="loader-stack"><img class="loader-logo" src="../fazja-preview/logo-chama-o-pro-transparent.png" alt="Símbolo do Chama O Pro"><strong>Não foi possível abrir o Chama O Pro.</strong><span>A ligação pode ter falhado momentaneamente. Podes tentar novamente sem perder dados.</span><button class="retry" type="button" onclick="location.reload()">Tentar novamente</button></div></div>';
      }
    })();
  </script>
</body>
</html>

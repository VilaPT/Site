<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b555d">
  <meta name="description" content="Chama O Pro. Precisas. Encontras. Está feito.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Chama O Pro | Precisas. Encontras. Está feito.</title>
  <link rel="preload" href="../fazja-preview/logo-chama-o-pro-transparent.png" as="image" type="image/png">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#0b555d,#073d44);color:#fff;min-height:100svh;overflow:hidden}.loader{position:fixed;inset:0;display:grid;place-items:center;padding:24px}.loader-stack{display:grid;place-items:center;text-align:center;gap:12px}.loader-logo{display:block;width:clamp(175px,48vw,245px);height:auto;opacity:0;transform:scale(.92);animation:logoIn .45s ease forwards,logoGlow .75s ease-in-out .45s infinite alternate}.loader.error .loader-logo{opacity:1;transform:none;animation:none;width:150px}.loader span{color:#dce9e9;font-size:14px}@keyframes logoIn{to{opacity:1;transform:scale(1)}}@keyframes logoGlow{from{filter:drop-shadow(0 10px 20px rgba(0,0,0,.22)) drop-shadow(0 0 8px rgba(74,232,225,.18))}to{filter:drop-shadow(0 15px 28px rgba(0,0,0,.28)) drop-shadow(0 0 26px rgba(74,232,225,.68))}}@media(prefers-reduced-motion:reduce){.loader-logo{animation:none;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="loader" id="openingLoader" aria-label="A abrir o Chama O Pro"><div class="loader-stack"><img class="loader-logo" src="../fazja-preview/logo-chama-o-pro-transparent.png" alt="Símbolo do Chama O Pro" fetchpriority="high"></div></div>
  <script>
    (async function(){
      const startedAt=performance.now(),minimumLoadingMs=1200;
      try{
        const fresh=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
        const response=await fetch('../fazja-preview/index.html?fresh='+encodeURIComponent(fresh),{cache:'no-store'});
        if(!response.ok)throw new Error('Falha ao carregar a aplicação');
        let html=await response.text();
        html=html.replace('<head>','<head><base href="../fazja-preview/">');
        html=html.replace(/\?v=\d+/g,'?fresh='+fresh);
        const styles=['community18.css','brand20.css','ux24.css','ux25.css','verification29.css','profile30.css','chat31.css','appointment32.css','ux33.css','ux34.css','directchat35.css','homepage36.css','homepage37.css','business37.css','social38.css','professional-activity.css','admin-control.css','reports.css','owner-console.css','owner-district-multi.css','auth-viewport.css','pro-editor-viewport.css'];
        const styleTags=styles.map(src=>'<link rel="stylesheet" href="./'+src+'?fresh='+fresh+'">').join('');
        html=html.replace('</head>',styleTags+'</head>');
        const scripts=['js/community.js','enhancements26.js','navigation25.js','homepage36.js','homepage37.js','business37.js','social38.js','professional-activity.js','reports.js','admin-control.js','district-profile.js','owner-console.js','owner-district-multi.js'];
        const scriptTags=scripts.map(src=>'<scr'+'ipt type="module" src="./'+src+'?fresh='+fresh+'"></scr'+'ipt>').join('');
        html=html.replace('</body>',scriptTags+'</body>');
        const remaining=Math.max(0,minimumLoadingMs-(performance.now()-startedAt));if(remaining)await new Promise(r=>setTimeout(r,remaining));
        document.open();document.write(html);document.close();
      }catch(error){
        console.error(error);document.body.innerHTML='<div class="loader error"><div class="loader-stack"><img class="loader-logo" src="../fazja-preview/logo-chama-o-pro-transparent.png" alt="Símbolo do Chama O Pro"><strong>Não foi possível abrir o Chama O Pro.</strong><span>Recarrega a página para tentar novamente.</span></div></div>';
      }
    })();
  </script>
</body>
</html>
